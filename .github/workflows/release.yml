name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Zip packs
        run: |
          for dir in */; do
            zip -r "${dir%/}.zip" "$dir"
          done

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: "*.zip"
